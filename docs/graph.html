<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>협업 그래프 · 게임 개발 직무 지식 지도</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="./index.html">Game Career Map</a>
  <nav aria-label="주요 메뉴"><a href="./index.html">직무</a><a class="active" href="./graph.html">협업 그래프</a></nav>
</header>
<main class="container graph-page">
  <section class="graph-intro">
    <p class="eyebrow">COLLABORATION GRAPH</p>
    <h1>직무 간 협업 관계</h1>
    <p>정점은 세부 직무, 엣지는 설계·구현·콘텐츠 전달·기술 의존·검증 등의 협업 관계를 뜻합니다. 노드를 선택하면 직접 연결된 관계만 강조됩니다.</p>
  </section>
  <div class="graph-toolbar">
    <label class="search"><span class="sr-only">그래프 직무 검색</span><input id="graphSearch" type="search" placeholder="직무 검색" autocomplete="off" /></label>
    <select id="relationFilter" aria-label="관계 유형"><option value="all">모든 관계</option></select>
    <button id="resetGraph" class="button" type="button">선택 초기화</button>
  </div>
  <section class="graph-layout">
    <div class="graph-canvas-wrap">
      <svg id="graphSvg" class="graph-canvas" viewBox="0 0 1200 760" role="img" aria-label="게임 개발 직무 협업 그래프"></svg>
      <p class="graph-help">노드를 클릭하면 연결 관계를 강조합니다. 노드를 다시 클릭하면 직무 상세 페이지로 이동할 수 있습니다.</p>
    </div>
    <aside id="graphInfo" class="graph-info"><h2>관계 설명</h2><p>직무 노드 또는 엣지를 선택하세요.</p></aside>
  </section>
  <section class="relation-list-section"><h2>현재 표시되는 관계</h2><div id="relationList" class="relation-list"></div></section>
</main>
<footer><p>게임 개발 직무 지식 지도 · 정적 GitHub Pages 프로젝트</p></footer>
<script src="./assets/common.js"></script>
<script src="./assets/graph.js"></script>
</body>
</html>
